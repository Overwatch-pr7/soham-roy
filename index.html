<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>retro-resume</title>
  </head>
  <body>
    <style>
      /*custom font work*/
      @font-face{
        font-family: monogram;
        src: url(/soham-roy/monogram.ttf)
      }

      body{
        font-family: monogram, monospace;
        font-size: 2rem; 
        overflow: hidden; /*no scrolling!*/
      }

      #app{
        width: 100%;
        height: 100%;
        position: relative; /*better control over element*/
      }

      #textbox{
        position: absolute;
        left: 10%;
        right: 10%;
        bottom: 2vh;
        min-height: 10vh;
        background: white;
        border-radius: 3px;
        outline-style: solid;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        flex-wrap: wrap;
        justify-content: flex-start;
        align-items: flex-start;
        word-spacing: 0.2rem;
        filter: drop-shadow(0 0 07.5rem rgb(112, 112, 112));
      }

      .ui-text{
        margin: 0;
        user-select: none;
      }

      .ui-close-button{
        font-family: inherit;
        border-style: none;
        border-radius: 3px;
        padding: 1rem;
        font-size: inherit;        
      }

      .button-container{
        align-self: flex-end;
        margin-top: 1rem;
      }

      .note{
        position: absolute;
        left: 5%;
        top: 1vh;
        display: flex;
        flex-direction: column;
        color: rgb(239, 198, 198);
        user-select: none;  
      }

      .score-container{
        position: absolute;
        right: 5%;
        top: 1vh;
        color: rgb(239, 198, 198);
        user-select: none;
      }

      .resume-btn{
        position: absolute;
        left: 5%;
        bottom: 5vh;
        background: white;
        color: black;
        text-decoration: none;
        padding: 0.5rem 1rem;
        border-radius: 3px;
        border: 2px solid black;
        font-family: inherit;
        filter: drop-shadow(0 0 0.5rem rgb(0, 0, 0));
        z-index: 100;
        user-select: none;
        transition: transform 0.1s;
      }
      
      .resume-btn:hover {
        background: #f0f0f0;
        transform: scale(1.05);
      }

    </style>
    <div id="app">
      <div id="ui">
        <p class="note">Tap/Click to a spot to move<br>to that location.<br>Or use the WASD keys!<br>Just go near various objects to<br>know more about them :)</p>
        <div class="score-container">
          Score: <span id="score">0</span>
        </div>
        <a href="/soham-roy/resume.pdf" target="_blank" class="resume-btn">View Resume PDF</a>
        <div id="textbox-container" style="display: none"> <!--not best practice. could've made an id up in style-->
          <div id="textbox">
            <p id="dialogue" class="ui-text"></p>
            <div class="button-container">
              <button id="close" class="ui-close-button">Close</button>
            </div>
          </div>
          
        </div>
      </div> <!-- contains all the ui like textbox, text, etc -->
      <canvas id="game"></canvas> <!-- here we give control to kaboom -->
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
